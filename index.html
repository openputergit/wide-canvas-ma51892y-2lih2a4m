<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankNifty Trading Strategy Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(120deg, #1a4f70 0%, #2c7da0 100%);
        }
        .card-hover:hover {
            transform: translateY(-5px);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="gradient-bg text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">BankNifty Trader</h1>
            <div class="space-x-4">
                <button id="connectBtn" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg">
                    <i class="bi bi-plug-fill mr-2"></i>Connect Broker
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <!-- Main Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Price Monitor -->
            <div class="bg-white p-6 rounded-xl shadow-md card-hover">
                <h2 class="text-xl font-semibold mb-4">BankNifty Price</h2>
                <div class="text-3xl font-bold text-blue-600" id="currentPrice">43,250</div>
                <div class="text-sm text-gray-500 mt-2">Last Updated: <span id="lastUpdate">Just now</span></div>
            </div>

            <!-- ATH Details -->
            <div class="bg-white p-6 rounded-xl shadow-md card-hover">
                <h2 class="text-xl font-semibold mb-4">All-Time High</h2>
                <div class="text-3xl font-bold text-green-600" id="athPrice">43,100</div>
                <button onclick="updateATH()" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">
                    <i class="bi bi-arrow-clockwise mr-2"></i>Update ATH
                </button>
            </div>

            <!-- Strategy Status -->
            <div class="bg-white p-6 rounded-xl shadow-md card-hover">
                <h2 class="text-xl font-semibold mb-4">Strategy Status</h2>
                <div class="text-lg" id="strategyStatus">Monitoring...</div>
                <div class="mt-4 space-y-2">
                    <div>Points Above ATH: <span id="pointsAboveATH" class="font-semibold">150</span></div>
                    <div>Target Strike: <span id="targetStrike" class="font-semibold">43,150</span></div>
                </div>
            </div>
        </div>

        <!-- Trade Log -->
        <div class="mt-8 bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-semibold mb-4">Trade Log</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full table-auto">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Timestamp</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Option</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tradeLog" class="bg-white divide-y divide-gray-200">
                        <!-- Trade logs will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Mock data and functionality
        let currentATH = 43100;
        let isConnected = false;

        // Connect/Disconnect broker
        document.getElementById('connectBtn').addEventListener('click', function() {
            isConnected = !isConnected;
            this.className = isConnected ? 
                'bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg' : 
                'bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg';
            this.innerHTML = isConnected ? 
                '<i class="bi bi-plug mr-2"></i>Disconnect' : 
                '<i class="bi bi-plug-fill mr-2"></i>Connect Broker';
        });

        // Update ATH
        function updateATH() {
            const newATH = prompt("Enter new ATH value:", currentATH);
            if (newATH && !isNaN(newATH)) {
                currentATH = parseInt(newATH);
                document.getElementById('athPrice').textContent = currentATH;
                checkStrategy();
            }
        }

        // Check strategy conditions
        function checkStrategy() {
            const currentPrice = parseInt(document.getElementById('currentPrice').textContent);
            const pointsAbove = currentPrice - currentATH;
            const targetStrike = currentPrice - 100;
            
            document.getElementById('pointsAboveATH').textContent = pointsAbove;
            document.getElementById('targetStrike').textContent = targetStrike;

            if (pointsAbove >= 150) {
                document.getElementById('strategyStatus').innerHTML = 
                    '<span class="text-green-600"><i class="bi bi-check-circle-fill mr-2"></i>Trade Triggered!</span>';
                logTrade(currentPrice, targetStrike);
            } else {
                document.getElementById('strategyStatus').innerHTML = 
                    '<span class="text-blue-600"><i class="bi bi-eye-fill mr-2"></i>Monitoring...</span>';
            }
        }

        // Log trades
        function logTrade(price, strike) {
            const table = document.getElementById('tradeLog');
            const row = table.insertRow(0);
            row.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap">${new Date().toLocaleString()}</td>
                <td class="px-6 py-4 whitespace-nowrap">BN ${strike} CE</td>
                <td class="px-6 py-4 whitespace-nowrap">${price}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                        Executed
                    </span>
                </td>
            `;
        }

        // Simulate price updates
        setInterval(() => {
            if (isConnected) {
                const randomChange = Math.floor(Math.random() * 100) - 50;
                const currentPrice = parseInt(document.getElementById('currentPrice').textContent);
                document.getElementById('currentPrice').textContent = currentPrice + randomChange;
                document.getElementById('lastUpdate').textContent = 'Just now';
                checkStrategy();
            }
        }, 5000);
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
